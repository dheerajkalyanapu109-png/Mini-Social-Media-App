{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Social</title><link rel="stylesheet" href="{% static 'style.css' %}"></head>
<body>
<header class="bar"><a class="logo" href="{% url 'feed' %}">Mini Social</a>
<nav>
 {% if user.is_authenticated %}<a href="{% url 'profile' user.username %}">@{{ user.username }}</a>
 <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="link">Log out</button></form>
 {% else %}<a href="{% url 'login' %}">Log in</a><a href="{% url 'register' %}">Sign up</a>{% endif %}
</nav></header>
<main>
{% for m in messages %}<p class="msg">{{ m }}</p>{% endfor %}
{% block content %}{% endblock %}
</main>
<script src="{% static 'app.js' %}"></script>
</body></html>
